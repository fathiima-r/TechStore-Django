<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - TechStore</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
        min-height: 100vh;
    }

    a {
        text-decoration: none;
        color: inherit;
    }



    .navbar {
        height: 64px;
        padding: 0 7%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: white;
        border-bottom: 1px solid #e5e5e5;
    }

    .logo {
        font-size: 22px;
        font-weight: 700;
    }

    .navbar nav {
        display: flex;
        gap: 25px;
    }

    .navbar nav a {
        font-size: 14px;
        color: #444;
    }

    .navbar nav a:hover {
        color: #0071e3;
    }


    .login-section {
        min-height: calc(100vh - 64px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 50px 20px;
    }

    .login-card {
        width: 100%;
        max-width: 430px;
        background: white;
        padding: 45px;
        border-radius: 25px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.07);
    }

    .login-card h1 {
        font-size: 38px;
        margin-bottom: 10px;
    }

    .subtitle {
        color: #666;
        margin-bottom: 30px;
    }


    .message {
        padding: 12px 15px;
        background: #fff0f0;
        color: #c62828;
        border-radius: 10px;
        margin-bottom: 20px;
        font-size: 14px;
    }


    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .form-group input {
        width: 100%;
        padding: 13px 15px;
        border: 1px solid #d2d2d7;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
    }

    .form-group input:focus {
        border-color: #0071e3;
        box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.1);
    }

    .forgot-password {
        display: block;
        text-align: right;
        margin-top: -8px;
        margin-bottom: 20px;
        color: #0071e3;
        font-size: 13px;
    }

    .forgot-password:hover {
        text-decoration: underline;
    }


    .login-button {
        width: 100%;
        border: none;
        padding: 14px;
        border-radius: 25px;
        background: #0071e3;
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 5px;
    }

    .login-button:hover {
        background: #005bb5;
    }

    .register-text {
        text-align: center;
        margin-top: 25px;
        color: #666;
        font-size: 14px;
    }

    .register-text a {
        color: #0071e3;
        font-weight: 600;
    }

    .home-link {
        display: block;
        text-align: center;
        margin-top: 18px;
        color: #666;
        font-size: 14px;
    }

    .home-link:hover {
        color: #0071e3;
    }

    @media (max-width: 600px) {

        .navbar {
            height: auto;
            padding: 20px;
            flex-direction: column;
            gap: 15px;
        }

        .navbar nav {
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .login-section {
            padding: 30px 15px;
        }

        .login-card {
            padding: 30px 25px;
        }

        .login-card h1 {
            font-size: 32px;
        }
    }
</style>

</head>

<body>

<header class="navbar">

<div class="logo">
    TechStore
</div>

<nav>

    <a href="{% url 'home' %}">
        Home
    </a>

    <a href="{% url 'products' %}">
        Products
    </a>

    <a href="{% url 'register' %}">
        Register
    </a>

</nav>

</header>


<section class="login-section">

<div class="login-card">

    <h1>
        Login
    </h1>

    <p class="subtitle">
        Login to your TechStore account.
    </p>


    {% if messages %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}



    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input type="text" id="username" name="username" placeholder="Enter your username" required>

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input type="password" id="password" name="password" placeholder="Enter your password" required>

        </div>

        <a href="{% url 'forgot_password' %}" class="forgot-password">
            Forgot Password?
        </a>


        <button type="submit" class="login-button">
            Login
        </button>

    </form>

    <p class="register-text">

        Don't have an account?

        <a href="{% url 'register' %}">
            Create one
        </a>

    </p>

    <a
        href="{% url 'home' %}"
        class="home-link"
    >
        ← Back to TechStore
    </a>

</div>

</section>

</body>
</html>
