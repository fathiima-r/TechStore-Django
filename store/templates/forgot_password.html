<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - TechStore</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* NAVBAR */

        .navbar {
            height: 64px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            border-bottom: 1px solid #e5e5e5;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
        }

        .navbar nav {
            display: flex;
            gap: 25px;
        }

        .navbar nav a {
            font-size: 14px;
            color: #444;
        }

        .navbar nav a:hover {
            color: #0071e3;
        }

        /* RESET SECTION */

        .reset-section {
            min-height: calc(100vh - 64px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .reset-card {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 45px;
            border-radius: 25px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.07);
        }

        .reset-card h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        /* MESSAGES */

        .message {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .error {
            background: #fff0f0;
            color: #c62828;
        }

        .success {
            background: #eef9f0;
            color: #2e7d32;
        }

        /* FORM */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #0071e3;
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.1);
        }

        /* BUTTON */

        .reset-button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 25px;
            background: #0071e3;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        .reset-button:hover {
            background: #005bb5;
        }

        /* LINKS */

        .login-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #0071e3;
            font-size: 14px;
            font-weight: 600;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #666;
            font-size: 14px;
        }

        .home-link:hover {
            color: #0071e3;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .navbar {
                height: auto;
                padding: 20px;
                flex-direction: column;
                gap: 15px;
            }

            .navbar nav {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .reset-section {
                padding: 30px 15px;
            }

            .reset-card {
                padding: 30px 25px;
            }

            .reset-card h1 {
                font-size: 32px;
            }

        }

    </style>

</head>

<body>

<header class="navbar">

    <div class="logo">
        TechStore
    </div>

    <nav>

        <a href="{% url 'home' %}">
            Home
        </a>

        <a href="{% url 'products' %}">
            Products
        </a>

        <a href="{% url 'login' %}">
            Login
        </a>

    </nav>

</header>


<section class="reset-section">

    <div class="reset-card">

        <h1>
            Reset Password
        </h1>

        <p class="subtitle">
            Enter your account details and create a new password.
        </p>


        {% if messages %}

            {% for message in messages %}

                <div class="message
                    {% if message.tags == 'success' %}
                        success
                    {% else %}
                        error
                    {% endif %} ">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input type="text" id="username" name="username" placeholder="Enter your username" required>

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input type="email" id="email" name="email" placeholder="Enter your registered email" required>

            </div>


            <div class="form-group">

                <label for="new_password">
                    New Password
                </label>

                <input type="password" id="new_password" name="new_password" placeholder="Enter new password" required>

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm New Password
                </label>

                <input type="password" id="confirm_password" name="confirm_password" placeholder="Enter new password again" required>

            </div>


            <button type="submit" class="reset-button">
                Reset Password
            </button>

        </form>


        <a href="{% url 'login' %}" class="login-link">
            ← Back to Login
        </a>


        <a  href="{% url 'home' %}" class="home-link">
            Back to TechStore
        </a>

    </div>

</section>

</body>
</html>
